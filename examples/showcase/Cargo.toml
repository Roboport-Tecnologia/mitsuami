# Every example in one window: `cargo run --manifest-path examples/showcase/Cargo.toml`.
# A crate of its own, outside the workspace, as the GPU surface example it
# shows is: so wgpu isn't built with the workspace's tests.
[package]
name = "showcase-example"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "showcase"
path = "src/main.rs"

# The Linux toolkit, as `mitsuami`'s: `--no-default-features --features kde`
# builds it on Qt Quick and Kirigami without GTK, and `gtk-notebook-tabs`
# shows its tabs as a `gtk::Notebook`.
[features]
default = ["gtk"]
gtk = ["mitsuami/gtk"]
kde = ["mitsuami/kde"]
gtk-notebook-tabs = ["mitsuami/gtk-notebook-tabs"]

[dependencies]
mitsuami = { path = "../../crates/mitsuami", default-features = false }
wgpu = "30"
pollster = "0.4"
