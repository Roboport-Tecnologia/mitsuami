[package]
name = "mitsuami-test"
description = "Integration, end-to-end and snapshot testing for mitsuami apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
# Runs native tests on Qt Quick and Kirigami instead of GTK 4, on Linux.
# Turn it on together with `mitsuami`'s `kde` feature.
kde = ["dep:mitsuami-kirigami", "mitsuami-kirigami/qt"]

[dependencies]
mitsuami-core.workspace = true
mitsuami-reactive.workspace = true
mitsuami-headless.workspace = true
mitsuami-test-macros.workspace = true
inventory.workspace = true
similar.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mitsuami-appkit.workspace = true
objc2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mitsuami-gtk.workspace = true
mitsuami-kirigami = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
mitsuami-winui.workspace = true

[lints]
workspace = true

# Each platform's native driver shows on its own target.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
