name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the workspace version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mitsuami") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match workspace version ${version}"
            exit 1
          fi

  # Build and headless tests on every OS. The native suites don't gate
  # releases yet.
  test:
    needs: version
    uses: ./.github/workflows/test.yml
    with:
      headless_only: true

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # `cargo publish` builds every crate before uploading, and the GTK
      # backend needs the system GTK 4 and libadwaita headers to build.
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      # Publishes the crates not yet on crates.io, in dependency order.
      - name: Publish
        run: .github/scripts/publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The showcase, every example in one window, for each platform. A crate
  # of its own, outside the workspace (it has the GPU surface example,
  # which needs wgpu), so it builds with `--manifest-path`.
  showcase:
    name: Build the showcase (${{ matrix.name }})
    needs: test
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-universal, os: macos-15 }
          - { name: windows-x86_64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mitsuami-showcase-${{ github.ref_name }}-${{ matrix.name }}
      MANIFEST: examples/showcase/Cargo.toml
      BUILT: examples/showcase/target
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install GTK 4 and libadwaita
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --manifest-path "$MANIFEST"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$ARCHIVE"
          cp "$BUILT/release/showcase" "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      # One binary for Apple silicon and Intel Macs.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path "$MANIFEST" --target "$t"
          done
          mkdir "$ARCHIVE"
          lipo -create -output "$ARCHIVE/showcase" \
            "$BUILT/aarch64-apple-darwin/release/showcase" \
            "$BUILT/x86_64-apple-darwin/release/showcase"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir "$ARCHIVE"
          cp "$BUILT/release/showcase.exe" "$ARCHIVE/"
          7z a "$ARCHIVE.zip" "$ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*

  # The showcase on Qt Quick and Kirigami (the `kde` feature, without GTK),
  # in an Arch Linux container as in the KDE tests: Kirigami 6 isn't
  # packaged for Ubuntu 24.04.
  showcase-kde:
    name: Build the showcase (linux-x86_64-kde)
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel-20260920.0.596911
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mitsuami-showcase-${{ github.ref_name }}-linux-x86_64-kde
    steps:
      - name: Install Qt and Kirigami
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/20/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git rustup zip qt6-declarative kirigami qqc2-desktop-style

      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --manifest-path examples/showcase/Cargo.toml --no-default-features --features kde

      - name: Package
        run: |
          mkdir "$ARCHIVE"
          cp examples/showcase/target/release/showcase "$ARCHIVE/"
          zip -r "$ARCHIVE.zip" "$ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.zip

  release:
    name: Create the GitHub release
    needs: [publish, showcase, showcase-kde]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          cat > notes.md <<'EOF'
          ## The showcase

          Every example in one window, picked from its sidebar, built for each platform:

          - **Windows** (x86_64): needs the [Windows App Runtime 2.4 or later](https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe).
          - **macOS** (Apple silicon and Intel): the binary isn't signed. Run `xattr -dr com.apple.quarantine <folder>` after extracting, or allow it in System Settings → Privacy & Security.
          - **Linux** (x86_64): needs GTK 4.10 or later, libadwaita 1.4 or later (1.7 for its tabs as a view switcher) and glibc 2.39 or later (Ubuntu 24.04 and newer).
          - **Linux, KDE Plasma** (x86_64, the `-kde` archive): the same showcase on Qt Quick and Kirigami. Built on Arch Linux as of 20 September 2026, so it needs Qt 6, Kirigami and qqc2-desktop-style at least as new as Arch's then, and a glibc to match.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
