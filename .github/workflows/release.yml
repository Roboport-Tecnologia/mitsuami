name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the workspace version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mitsuami") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match workspace version ${version}"
            exit 1
          fi

  # Build and headless tests on every OS. The native suites don't gate
  # releases yet.
  test:
    needs: version
    uses: ./.github/workflows/test.yml
    with:
      headless_only: true

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # `cargo publish` builds every crate before uploading, and the GTK
      # backend needs the system GTK 4 and libadwaita headers to build.
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      # Publishes the crates not yet on crates.io, in dependency order.
      - name: Publish
        run: .github/scripts/publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  examples:
    name: Build the examples (${{ matrix.name }})
    needs: test
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-universal, os: macos-15 }
          - { name: windows-x86_64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mitsuami-examples-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Every example but run_loop_smoke, a check that the run loop ends.
      - name: List the examples
        run: echo "EXAMPLES=$(ls crates/mitsuami/examples | sed 's/\.rs$//' | grep -vx run_loop_smoke | xargs)" >> "$GITHUB_ENV"

      - name: Install GTK 4 and libadwaita
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release -p mitsuami $(printf -- '--example %s ' $EXAMPLES)

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$ARCHIVE"
          for e in $EXAMPLES; do cp "target/release/examples/$e" "$ARCHIVE/"; done
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      # One binary for Apple silicon and Intel Macs.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p mitsuami --target "$t" $(printf -- '--example %s ' $EXAMPLES)
          done
          mkdir "$ARCHIVE"
          for e in $EXAMPLES; do
            lipo -create -output "$ARCHIVE/$e" \
              "target/aarch64-apple-darwin/release/examples/$e" \
              "target/x86_64-apple-darwin/release/examples/$e"
          done
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir "$ARCHIVE"
          for e in $EXAMPLES; do cp "target/release/examples/$e.exe" "$ARCHIVE/"; done
          7z a "$ARCHIVE.zip" "$ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*

  # The same examples on Qt Quick and Kirigami (the `kde` feature), in an
  # Arch Linux container as in the KDE tests: Kirigami 6 isn't packaged for
  # Ubuntu 24.04. GTK 4 is there because the test kit, a dev-dependency,
  # needs it to build; the examples don't link it.
  examples-kde:
    name: Build the examples (linux-x86_64-kde)
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel-20260920.0.596911
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mitsuami-examples-${{ github.ref_name }}-linux-x86_64-kde
    steps:
      - name: Install Qt, Kirigami and GTK 4
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/20/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git rustup zip qt6-declarative kirigami qqc2-desktop-style gtk4

      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: List the examples
        run: echo "EXAMPLES=$(ls crates/mitsuami/examples | sed 's/\.rs$//' | grep -vx run_loop_smoke | xargs)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p mitsuami --features kde $(printf -- '--example %s ' $EXAMPLES)

      - name: Package
        run: |
          mkdir "$ARCHIVE"
          for e in $EXAMPLES; do cp "target/release/examples/$e" "$ARCHIVE/"; done
          zip -r "$ARCHIVE.zip" "$ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.zip

  release:
    name: Create the GitHub release
    needs: [publish, examples, examples-kde]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          cat > notes.md <<'EOF'
          ## Examples

          Every example, built for each platform:

          - **Windows** (x86_64): needs the [Windows App Runtime 2.4 or later](https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe).
          - **macOS** (Apple silicon and Intel): the binaries aren't signed. Run `xattr -dr com.apple.quarantine <folder>` after extracting, or allow them in System Settings → Privacy & Security.
          - **Linux** (x86_64): needs GTK 4.10 or later and glibc 2.39 or later (Ubuntu 24.04 and newer).
          - **Linux, KDE Plasma** (x86_64, the `-kde` archive): the same examples on Qt Quick and Kirigami. Built on Arch Linux as of 20 September 2026, so it needs Qt 6, Kirigami and qqc2-desktop-style at least as new as Arch's then, and a glibc to match.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
