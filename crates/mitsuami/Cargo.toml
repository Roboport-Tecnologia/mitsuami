[package]
name = "mitsuami"
description = "Native, declarative, cross-platform UI for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["gtk"]
# The Linux toolkit. With `kde`, Qt Quick and Kirigami (KDE Plasma) replace
# GTK 4, even if `gtk` is on too. They make no difference on macOS and
# Windows.
gtk = ["dep:mitsuami-gtk"]
kde = ["dep:mitsuami-kirigami", "mitsuami-kirigami/qt"]

[dependencies]
mitsuami-core.workspace = true
mitsuami-reactive.workspace = true
mitsuami-widgets.workspace = true
mitsuami-macros.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mitsuami-appkit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mitsuami-gtk = { workspace = true, optional = true }
mitsuami-kirigami = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
mitsuami-winui.workspace = true

[dev-dependencies]
mitsuami-test.workspace = true

