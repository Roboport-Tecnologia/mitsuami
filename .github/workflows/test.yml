name: Test

# Runs when started by hand (`gh workflow run test.yml --ref <branch>`), and
# from the release workflow on tags. Not on ordinary pushes.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      headless_only:
        description: Skip the native backend tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned, so native rendering only changes when we move images.
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # The one action from outside GitHub, pinned to its commit (v2.9.2):
      # a tag can be moved to other code, which would run with the job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # GTK 4 and libadwaita headers to build, gtk4-broadwayd for the native
      # tests' private display.
      - name: Install GTK 4
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtk-4-bin

      # The WinUI backend needs the Windows App Runtime 2.4+ installed, even
      # headless: its services tests always use the real services.
      - name: Install the Windows App Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\appruntime.exe
          & $env:RUNNER_TEMP\appruntime.exe --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The runner's display is 1024 × 768, and Windows makes a window no
      # wider than its display: the sidebar tests' window, 800 of content
      # beside NavigationView's open pane, doesn't fit (ARCHITECTURE §14.4).
      # Kirigami's offscreen screen is 1920 × 1080 for the same reason.
      - name: Widen the display
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Build
        run: cargo build --workspace --all-targets

      # Failures are also posted as annotations, so they show on the run's
      # summary page without digging through the log.
      - name: Test (headless)
        shell: bash
        run: .github/scripts/cargo-test.sh headless

      # Native snapshots and visual baselines depend on the machine's fonts,
      # OS version and scale, so they are kept per runner image
      # (tests/{snapshots,visual}/<backend>/<image>/, docs/ARCHITECTURE.md §12).
      - name: Test (native)
        if: ${{ !inputs.headless_only }}
        shell: bash
        run: .github/scripts/cargo-test.sh native
        env:
          MITSUAMI_NATIVE: "1"
          MITSUAMI_IMAGE: ${{ matrix.os }}

      # Missing and changed snapshots, for `.github/scripts/accept-snapshots.sh
      # <run id>`, and the visual review report of the changed captures.
      - name: Collect snapshots for review
        if: failure()
        shell: bash
        run: .github/scripts/collect-review.sh ${{ matrix.os }}

      - name: Upload snapshots for review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots.tar
          if-no-files-found: ignore

      - name: Upload the visual review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-review-${{ matrix.os }}
          path: visual-review
          if-no-files-found: ignore

  # The Qt Quick and Kirigami backend (the `kde` feature) on its own:
  # Kirigami 6 isn't packaged for Ubuntu 24.04, so this runs in an Arch Linux
  # container. Arch is rolling: the container and its packages are pinned to
  # one day of the Arch Linux Archive, so native rendering only changes when
  # we move that date (in the image, the mirror and MITSUAMI_IMAGE, together:
  # the baselines live under tests/{snapshots,visual}/kirigami/<image>/).
  # GTK 4 and libadwaita are there too: the test kit depends on the GTK
  # backend on Linux.
  kde:
    name: Test (KDE Plasma)
    if: ${{ !inputs.headless_only }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel-20260920.0.596911
    steps:
      - name: Install Qt, Kirigami, Breeze, GTK 4 and libadwaita
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/20/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git rustup qt6-declarative kirigami qqc2-desktop-style \
            breeze breeze-icons noto-fonts gtk4 libadwaita

      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2, pinned as above

      - name: Test (native, Kirigami)
        shell: bash
        run: |
          .github/scripts/cargo-test.sh kde -p mitsuami -p mitsuami-kirigami \
            --features mitsuami/kde,mitsuami-test/kde,mitsuami-kirigami/qt
        env:
          MITSUAMI_NATIVE: "1"
          MITSUAMI_IMAGE: archlinux-2026.09.20

      - name: Collect snapshots for review
        if: failure()
        shell: bash
        run: .github/scripts/collect-review.sh archlinux-2026.09.20-kde

      - name: Upload snapshots for review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots-archlinux-2026.09.20-kde
          path: snapshots.tar
          if-no-files-found: ignore

      - name: Upload the visual review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-review-archlinux-2026.09.20-kde
          path: visual-review
          if-no-files-found: ignore
