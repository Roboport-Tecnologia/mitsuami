name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the workspace version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mitsuami") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match workspace version ${version}"
            exit 1
          fi

  # Build and headless tests on every OS. The native suites don't gate
  # releases yet.
  test:
    needs: version
    uses: ./.github/workflows/test.yml
    with:
      headless_only: true

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # `cargo publish` builds every crate before uploading, and the GTK
      # backend needs the system GTK 4 and libadwaita headers to build.
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      # Publishes the crates not yet on crates.io, in dependency order.
      - name: Publish
        run: .github/scripts/publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The showcase, every example in one window, and the Files example, for
  # macOS and Windows. The showcase is a crate of its own, outside the
  # workspace (it has the GPU surface example, which needs wgpu), so it
  # builds with `--manifest-path`.
  apps:
    name: Build the apps (${{ matrix.name }})
    needs: test
    strategy:
      matrix:
        include:
          - { name: macos-universal, os: macos-15 }
          - { name: windows-x86_64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SUFFIX: ${{ github.ref_name }}-${{ matrix.name }}
      SHOWCASE: examples/showcase/Cargo.toml
      # The backend's floor (README), for the Intel half too.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # One binary for Apple silicon and Intel Macs, in an app bundle.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path "$SHOWCASE" --target "$t"
            cargo build --release -p mitsuami --example files --target "$t"
          done
          mkdir universal
          lipo -create -output universal/showcase examples/showcase/target/{aarch64,x86_64}-apple-darwin/release/showcase
          lipo -create -output universal/files target/{aarch64,x86_64}-apple-darwin/release/examples/files
          .github/scripts/macos-app.sh universal/showcase br.com.roboport.mitsuami.Showcase \
            "${GITHUB_REF_NAME#v}" "mitsuami-showcase-$SUFFIX.zip"
          .github/scripts/macos-app.sh universal/files br.com.roboport.mitsuami.Files \
            "${GITHUB_REF_NAME#v}" "mitsuami-files-$SUFFIX.zip"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --manifest-path "$SHOWCASE"
          cargo build --release -p mitsuami --example files
          for app in showcase files; do
            mkdir "mitsuami-$app-$SUFFIX"
          done
          cp examples/showcase/target/release/showcase.exe "mitsuami-showcase-$SUFFIX/"
          cp target/release/examples/files.exe "mitsuami-files-$SUFFIX/"
          for app in showcase files; do
            7z a "mitsuami-$app-$SUFFIX.zip" "mitsuami-$app-$SUFFIX"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: apps-${{ matrix.name }}
          path: "*.zip"

  # The showcase and the Files example as AppImages, on GTK and on Qt
  # Quick and Kirigami (the `kde` feature, without GTK). An AppImage
  # brings the toolkit, but not glibc: each is built on the oldest
  # distribution with a toolkit new enough, whose glibc is then the oldest
  # it runs on. Ubuntu 24.04 is the first with GTK 4.10 and libadwaita
  # 1.4. Fedora 42 has Kirigami 6.25 on glibc 2.41: Debian 13, on the
  # same glibc, has 6.13, older than the backend (it has no
  # `Theme.fixedWidthFont`), and Arch (the KDE tests') would ask for this
  # month's glibc. GTK's headers are in both: `mitsuami-test`, which the
  # Files example can use (a dev-dependency), has the GTK backend on
  # Linux; the KDE binary doesn't link it.
  appimage:
    name: Build the AppImages (${{ matrix.toolkit }})
    needs: test
    strategy:
      matrix:
        include:
          - toolkit: gtk
            image: ubuntu:noble-20260911
            features: ""
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              curl ca-certificates git build-essential pkg-config file patchelf libgtk-4-dev libadwaita-1-dev
          - toolkit: kde
            image: fedora:42
            features: --no-default-features --features kde
            qmake: /usr/lib64/qt6/bin/qmake
            install: >-
              dnf install -y gcc gcc-c++ pkgconf curl git file findutils patchelf gtk4-devel libadwaita-devel
              qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtwayland qt6-qtsvg
              kf6-kirigami-devel kf6-qqc2-desktop-style plasma-breeze plasma-integration
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      SUFFIX: ${{ github.ref_name }}-linux-x86_64-${{ matrix.toolkit }}
      QMAKE: ${{ matrix.qmake }}
    steps:
      - name: Install the toolkit
        run: ${{ matrix.install }}

      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: Build
        run: |
          cargo build --release -p mitsuami --example files ${{ matrix.features }}
          cargo build --release --manifest-path examples/showcase/Cargo.toml ${{ matrix.features }}

      - name: Package
        run: |
          .github/scripts/appimage.sh ${{ matrix.toolkit }} examples/showcase/target/release/showcase \
            br.com.roboport.mitsuami.Showcase "mitsuami-showcase-$SUFFIX.AppImage"
          .github/scripts/appimage.sh ${{ matrix.toolkit }} target/release/examples/files \
            br.com.roboport.mitsuami.Files "mitsuami-files-$SUFFIX.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: appimages-${{ matrix.toolkit }}
          path: "*.AppImage"

  release:
    name: Create the GitHub release
    needs: [publish, apps, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          cat > notes.md <<'EOF'
          [mitsuami.roboport.com.br](https://mitsuami.roboport.com.br)

          ## The showcase and Files

          The showcase is every example in one window, picked from its sidebar. Files is a file browser on the real file system. Both are built for each platform:

          - **macOS** (Apple silicon and Intel, macOS 11 or later): app bundles, signed ad hoc and not notarized. After unzipping, open the app once from Finder with Control-click → Open, or allow it in System Settings → Privacy & Security; or run `xattr -dr com.apple.quarantine <app>`.
          - **Windows** (x86_64, Windows 11): needs the [Windows App Runtime 2.4 or later](https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe). They aren't packaged, and Windows 10 runs WinUI apps only as packages.
          - **Linux** (x86_64): AppImages, on GTK (`-gtk`) and on Qt Quick and Kirigami, as KDE Plasma's apps are (`-kde`). They bring their toolkit: the GTK ones need glibc 2.39 or later (Ubuntu 24.04 and newer), the KDE ones glibc 2.41 or later (Debian 13, Fedora 42, Ubuntu 25.04 and newer). Make one executable (`chmod +x`) and run it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
