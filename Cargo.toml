[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/Roboport-Tecnologia/mitsuami"
homepage = "https://mitsuami.roboport.com.br"

[workspace.dependencies]
mitsuami = { path = "crates/mitsuami", version = "=1.1.0" }
mitsuami-reactive = { path = "crates/mitsuami-reactive", version = "=1.1.0" }
mitsuami-core = { path = "crates/mitsuami-core", version = "=1.1.0" }
mitsuami-widgets = { path = "crates/mitsuami-widgets", version = "=1.1.0" }
mitsuami-headless = { path = "crates/mitsuami-headless", version = "=1.1.0" }
mitsuami-test = { path = "crates/mitsuami-test", version = "=1.1.0" }
mitsuami-test-macros = { path = "crates/mitsuami-test-macros", version = "=1.1.0" }
mitsuami-macros = { path = "crates/mitsuami-macros", version = "=1.1.0" }
mitsuami-appkit = { path = "crates/mitsuami-appkit", version = "=1.1.0" }
mitsuami-gtk = { path = "crates/mitsuami-gtk", version = "=1.1.0" }
mitsuami-winui = { path = "crates/mitsuami-winui", version = "=1.1.0" }
mitsuami-kirigami = { path = "crates/mitsuami-kirigami", version = "=1.1.0" }
mitsuami-linux = { path = "crates/mitsuami-linux", version = "=1.1.0" }

slotmap = "1.1"
taffy = "0.14"
inventory = "0.3"
similar = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
png = "0.18"
raw-window-handle = "0.6"
unicode-segmentation = "1.13"
cc = "1.2"
# Localization (docs/ARCHITECTURE.md §8): Project Fluent, the version
# fluent-bundle builds on, and its language identifiers.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = { version = "0.13", features = ["cldr"] }
unic-langid = "0.9"
intl-memoizer = "0.5"
pkg-config = "0.3"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
objc2-core-foundation = "0.3"
objc2-game-controller = "0.3"
# FileIcon's thumbnails, as Finder makes them.
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
    "std",
    "QLThumbnailGenerator",
    "QLThumbnailGenerationRequest",
    "QLThumbnailRepresentation",
    "bitflags",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
] }
block2 = "0.6"
dispatch2 = "0.3"

# GTK 4.10 is the floor (docs/ARCHITECTURE.md §11).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
# libadwaita 1.4 for the sidebar's navigation split view. The tab view's
# inline view switcher (1.7) is looked up at run time.
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
libc = "0.2"
# GpuSurface's own subsurface, pointer lock and shortcuts inhibitor on Wayland, through the toolkit's
# connection; libwayland-client is loaded at run time, as the toolkit has
# loaded it.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# GpuSurface's child window on X11, on a connection of its own (xcb is
# thread-safe, so the app presents from any thread); libxcb is loaded at
# run time too.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "shape", "xinput"] }

windows-core = "0.100"
windows-link = "0.100"
windows-collections = "0.100"
windows-future = "0.100"
windows-reference = "0.100"
windows-time = "0.100"

[profile.dev]
# Full debuginfo made every example and test binary over 100MB, nearly all of
# it DWARF duplicated per binary. Line tables keep file:line in backtraces.
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
